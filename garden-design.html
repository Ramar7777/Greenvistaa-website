<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Garden Design | GreenVistaa</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5faf3;
  color: #17352a;
}

/* HEADER */

header {
  background: #ffffff;
  padding: 20px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 15px #00000015;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #0d4d2c;
}

.logo span {
  color: #70bd43;
}

.back {
  text-decoration: none;
  background: #0d4d2c;
  color: white;
  padding: 10px 18px;
  border-radius: 25px;
}

/* HERO */

.hero {
  padding: 80px 7%;
  text-align: center;
  background:
    linear-gradient(#06351dcc,#06351dcc),
    url("hero.jpg") center/cover;
  color: white;
}

.hero h1 {
  font-size: 48px;
  margin: 10px 0;
}

.hero p {
  max-width: 650px;
  margin: auto;
  line-height: 1.7;
}

/* GALLERY */

.gallery-section {
  padding: 70px 7%;
}

.gallery-section h2 {
  text-align: center;
  font-size: 35px;
}

.gallery-section > p {
  text-align: center;
  color: #68766f;
  margin-bottom: 40px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 20px;
}

.gallery img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  border-radius: 15px;
  cursor: pointer;
  transition: 0.3s;
}

.gallery img:hover {
  transform: scale(1.03);
}

/* UPLOAD */

.upload-box {
  margin-top: 50px;
  background: white;
  padding: 30px;
  text-align: center;
  border-radius: 15px;
  box-shadow: 0 5px 25px #00000010;
}

.upload-box h3 {
  margin-bottom: 10px;
}

#photoInput {
  margin-top: 15px;
}

/* MOBILE */

@media(max-width:700px) {

  .gallery {
    grid-template-columns: 1fr;
  }

  .hero h1 {
    font-size: 36px;
  }

  header {
    padding: 18px 5%;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">
    🌿 Green<span>Vistaa</span>
  </div>

  <a href="index.html" class="back">
    ← Back
  </a>

</header>


<section class="hero">

  <h1>Garden Design</h1>

  <p>
    We create beautiful, functional and sustainable
    garden spaces designed specially for your home.
  </p>

</section>


<section class="gallery-section">

  <h2>Our Garden Design Work</h2>

  <p>
    Explore some of our garden design projects.
  </p>


  <div class="gallery" id="gallery">

    <img src="img1.jpeg"
         alt="Garden Design">

    <img src="img2.jpeg"
         alt="Garden Design">

    <img src="img3.jpeg"
         alt="Garden Design">

    <img src="img4.jpeg"
         alt="Garden Design">

  

  </div>


 
</section>


<script>

const photoInput =
document.getElementById("photoInput");

const gallery =
document.getElementById("gallery");


photoInput.addEventListener("change", function() {

  const files = this.files;

  for (let file of files) {

    const reader =
    new FileReader();

    reader.onload = function(e) {

      const img =
      document.createElement("img");

      img.src = e.target.result;

      img.alt = "Garden Design";

      gallery.appendChild(img);

    };

    reader.readAsDataURL(file);

  }

});

</script>

</body>
</html>
