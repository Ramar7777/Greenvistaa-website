<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Green Vistaa</title>
  <style>
    :root {
      --gv-dark: #0b3d25;
      --gv-darker: #062416;
      --gv-green: #2f9d4f;
      --gv-lime: #70bd43;
      --gv-light-bg: #f5f8f2;
      --gv-card-bg: #ffffff;
      --gv-text: #17352a;
      --gv-muted: #5e7368;
      --gv-border: rgba(11, 61, 37, 0.12);
      --gv-danger: #d9383a;
      --gv-danger-bg: #fdf2f2;
      --gv-shadow: 0 20px 40px rgba(11, 61, 37, 0.12), 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      background-color: var(--gv-light-bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(47, 157, 79, 0.09) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(11, 61, 37, 0.12) 0px, transparent 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--gv-text);
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--gv-card-bg);
      border-radius: 20px;
      padding: 42px 36px;
      box-shadow: var(--gv-shadow);
      border: 1px solid var(--gv-border);
      position: relative;
      overflow: hidden;
    }

    .login-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--gv-dark), var(--gv-green), var(--gv-lime));
    }

    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      background: var(--gv-light-bg);
      border-radius: 50%;
      margin-bottom: 16px;
      border: 2px solid rgba(47, 157, 79, 0.2);
      box-shadow: 0 4px 14px rgba(47, 157, 79, 0.15);
    }

    .brand-logo-wrap img {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
    }

    .brand-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gv-dark);
      letter-spacing: -0.02em;
    }

    .brand-header p {
      font-size: 0.9rem;
      color: var(--gv-muted);
      margin-top: 4px;
    }

    .error-alert {
      display: none;
      background-color: var(--gv-danger-bg);
      color: var(--gv-danger);
      border: 1px solid rgba(217, 56, 58, 0.3);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      margin-bottom: 22px;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--gv-dark);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      font-size: 0.96rem;
      color: var(--gv-text);
      background: #fafcf8;
      border: 1.5px solid rgba(11, 61, 37, 0.18);
      border-radius: 10px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      background: #ffffff;
      border-color: var(--gv-green);
      box-shadow: 0 0 0 4px rgba(47, 157, 79, 0.15);
    }

    .submit-btn {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, var(--gv-dark), #105934);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s ease;
      box-shadow: 0 6px 16px rgba(11, 61, 37, 0.25);
      margin-top: 12px;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #0e4c2e, var(--gv-green));
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(11, 61, 37, 0.32);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .login-footer {
      text-align: center;
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid var(--gv-border);
      font-size: 0.85rem;
      color: var(--gv-muted);
    }

    .login-footer a {
      color: var(--gv-green);
      text-decoration: none;
      font-weight: 600;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    .credential-hint {
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--gv-muted);
      background: rgba(47, 157, 79, 0.08);
      padding: 8px 12px;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-logo-wrap">
        <img src="../assets/images/logo.jpeg" alt="Green Vistaa Emblem" />
      </div>
      <h1>Green Vistaa CMS</h1>
      <p>Sign in to manage website content</p>
    </div>

    <!-- Error message alert banner -->
    <div id="errorMsg" class="error-alert"></div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
            autofocus
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
          />
        </div>
      </div>

      <button type="submit" class="submit-btn" id="loginBtn">
        Sign In to Dashboard →
      </button>

      <div class="credential-hint">
        🔑 Default Admin Access: <strong>admin</strong> / <strong>admin</strong>
      </div>
    </form>

    <div class="login-footer">
      <a href="../index.html">← Return to Public Website</a>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      // If already logged in, redirect straight to dashboard
      if (sessionStorage.getItem("gv_admin_logged") === "true") {
        window.location.href = "dashboard.html";
        return;
      }

      const form = document.getElementById("loginForm");
      const errorMsg = document.getElementById("errorMsg");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        const u = document.getElementById("username").value.trim();
        const p = document.getElementById("password").value.trim();

        if (u === "admin" && p === "admin") {
          sessionStorage.setItem("gv_admin_logged", "true");
          window.location.href = "dashboard.html";
        } else {
          errorMsg.textContent = "Invalid username or password (Use admin / admin)";
          errorMsg.style.display = "flex";
        }
      });
    })();
  </script>
</body>
</html>
