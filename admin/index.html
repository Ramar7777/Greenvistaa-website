<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Green Vistaa</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #062314;
      background-image: radial-gradient(circle at 50% 20%, rgba(47, 157, 79, 0.15) 0%, transparent 60%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .brand-header img {
      height: 38px;
      width: auto;
    }
    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0b3d25;
      letter-spacing: -0.01em;
    }
    .brand-title span {
      color: #2f9d4f;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #62746a;
      margin-bottom: 28px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #17352a;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d2ded7;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #2f9d4f;
      box-shadow: 0 0 0 3px rgba(47, 157, 79, 0.15);
    }
    .login-btn {
      width: 100%;
      padding: 13px;
      background: #0b3d25;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .login-btn:hover {
      background: #2f9d4f;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(47, 157, 79, 0.3);
    }
    .error-msg {
      background: #fde8e8;
      color: #c81e1e;
      font-size: 0.88rem;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 18px;
      display: none;
      border: 1px solid #f8b4b4;
    }
    .back-home {
      display: inline-block;
      margin-top: 24px;
      font-size: 0.85rem;
      color: #62746a;
      text-decoration: none;
    }
    .back-home:hover {
      color: #0b3d25;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <img src="../assets/images/logo.jpeg" alt="Logo" onerror="this.style.display='none';" />
      <div class="brand-title">GREEN <span>VISTAA</span></div>
    </div>
    <p class="subtitle">Admin Management Portal</p>

    <!-- Error Alert Banner -->
    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password" />
      </div>

      <button type="submit" class="login-btn">Sign In to Dashboard</button>
    </form>

    <a href="../index.html" class="back-home">← Back to Green Vistaa Website</a>
  </div>

  <script>
    // Automatically cleans the URL in the browser bar
    if (window.location.pathname.endsWith("index.html")) {
      const cleanPath = window.location.pathname.replace("index.html", "");
      window.history.replaceState(null, "", cleanPath);
    }

    // If already logged in, redirect straight to dashboard
    if (sessionStorage.getItem("gv_admin_logged") === "true") {
      window.location.href = "dashboard.html";
    }

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value.trim();
      const errorDiv = document.getElementById("errorMsg");

      // Verify Credentials (admin / admin)
      if (u === "admin" && p === "admin") {
        sessionStorage.setItem("gv_admin_logged", "true");
        window.location.href = "dashboard.html";
      } else {
        errorDiv.textContent = "Invalid username or password! (Use: admin / admin)";
        errorDiv.style.display = "block";
      }
    });
  </script>
</body>
</html>
