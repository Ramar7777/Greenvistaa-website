<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garden Design - Green Vistaa</title>
  <meta name="description" content="Explore our beautiful, functional, and sustainable garden design projects." />

  <!-- Global Subpages Stylesheet -->
  <link rel="stylesheet" href="../assets/css/global-subpages.css" />

  <style>
    /* ===================================================
       PAGE-SPECIFIC STYLES: GARDEN DESIGN
       =================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: var(--text);
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 15%, rgba(47, 157, 79, 0.06) 0px, transparent 40%),
        radial-gradient(at 100% 85%, rgba(112, 189, 67, 0.05) 0px, transparent 40%);
      background-attachment: fixed;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Hero Banner */
    .hero {
      position: relative;
      background-color: var(--gv-dark);
      background-image: 
        linear-gradient(rgba(11, 61, 37, 0.78), rgba(13, 77, 44, 0.82)),
        url("../assets/images/Main_hero_BG.jpeg");
      background-size: cover;
      background-position: center;
      color: #ffffff;
      text-align: center;
      padding: 85px 24px;
    }

    .hero-eyebrow {
      display: inline-block;
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--gv-lime);
      background: rgba(112, 189, 67, 0.15);
      border: 1px solid rgba(112, 189, 67, 0.3);
      padding: 4px 14px;
      border-radius: 99px;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    .hero p {
      font-size: clamp(1rem, 1.8vw, 1.15rem);
      max-width: 620px;
      margin: 0 auto;
      color: rgba(255, 255, 255, 0.92);
      line-height: 1.6;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    /* Section Headers & Content Section */
    .content-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    .section-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .section-header h2 {
      font-size: clamp(1.75rem, 3vw, 2.3rem);
      color: var(--gv-dark);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .divider {
      width: 72px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gv-green), transparent);
      border-radius: 99px;
      margin: 12px auto;
    }

    .section-header p {
      color: var(--muted);
      font-size: 1.05rem;
    }

    @media (max-width: 600px) {
      .hero {
        padding: 55px 16px;
      }
      .content-section {
        padding: 45px 16px 60px;
      }
    }
  </style>
</head>
<body>

  <!-- Shared Global Header Component Target -->
  <div id="global-header"></div>

  <!-- Hero Section -->
  <section class="hero">
    <span class="hero-eyebrow">Portfolio Showcase</span>
    <h1>Garden Design</h1>
    <p>We create beautiful, functional, and sustainable garden spaces designed specially for your home.</p>
  </section>

  <!-- Gallery Section -->
  <section class="content-section">
    <div class="section-header">
      <h2>Our Garden Design Work</h2>
      <div class="divider"></div>
      <p>Explore some of our garden design projects.</p>
    </div>

    <div class="gv-gallery-grid" id="gallery">
      <div class="gv-gallery-item">
        <img src="../assets/images/img1.jpeg" alt="Garden Landscape" loading="lazy" />
      </div>
      <div class="gv-gallery-item">
        <img src="../assets/images/img2.jpeg" alt="Stone Stepping Pathway" loading="lazy" />
      </div>
      <div class="gv-gallery-item">
        <img src="../assets/images/img3.jpeg" alt="Outdoor Stone Seating" loading="lazy" />
      </div>
      <div class="gv-gallery-item">
        <img src="../assets/images/img4.jpeg" alt="Verdant Indoor Garden" loading="lazy" />
      </div>
    </div>
  </section>

  <!-- Shared Global Footer Component Target -->
  <div id="global-footer"></div>

  <!-- Shared Global Subpages Script -->
  <script src="../assets/js/global-subpages.js"></script>

  <!-- Client-side script with defensive checks -->
  <script>
    (function () {
      "use strict";

      // Defensively check photoInput and gallery to prevent runtime errors
      const photoInput = document.getElementById("photoInput");
      const gallery = document.getElementById("gallery");

      if (photoInput && gallery) {
        photoInput.addEventListener("change", function (e) {
          const files = Array.from(e.target.files);

          files.forEach((file) => {
            if (!file.type.startsWith("image/")) return;

            const reader = new FileReader();
            reader.onload = function (event) {
              const card = document.createElement("div");
              card.className = "gv-gallery-item";

              const img = document.createElement("img");
              img.src = event.target.result;
              img.alt = file.name || "Garden Design Project";
              img.loading = "lazy";

              card.appendChild(img);
              gallery.appendChild(card);
            };
            reader.readAsDataURL(file);
          });
        });
      }
    })();
  </script>
</body>
</html>
